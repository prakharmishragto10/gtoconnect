name: gtoconnect
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.8.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  flutter_map: ^6.1.0
  geolocator: ^12.0.0
  image_picker: ^1.2.1
  http_parser: ^4.1.2
  url_launcher: ^6.3.2
  latlong2: ^0.9.0
  intl: ^0.19.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

# Home-screen / browser icons. After changing the images run:
#   dart run flutter_launcher_icons
flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0B2545"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/logo_mark.png
    - assets/logo_full.png
